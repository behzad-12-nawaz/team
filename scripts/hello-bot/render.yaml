services:
  - type: web
    name: dosecare-hello-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BOT_SERVICE_TOKEN
        sync: false
      - key: API_URL
        sync: false
